<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link href="styles.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">
        <img
          src="assets/MASALOGO.png"
          alt="Candy Shop Logo"
          style="height: 100px; width: 100px"
        />
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link me-4" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link me-4" href="shop.html">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active me-4" href="contact.html">Contact Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link me-4" href="cart.html">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link me-4 logout-button" href="#">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Form Section -->
    <section class="contact-section">
      <div class="container py-5">
        <h1 class="text-center textcolor mb-4">Get in Touch</h1>
        <p class="text-center writing mb-5">
          Have a question or need assistance? We’d love to hear from you!
        </p>

        <form
          class="contact-form mx-auto p-4 shadow-sm"
          style="max-width: 600px"
        >
          <div class="mb-3">
            <label for="name" class="form-label textcolor">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter your full name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label textcolor"
              >Email Address</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label textcolor">Message</label>
            <textarea
              class="form-control"
              id="message"
              rows="5"
              placeholder="Write your message here"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-lg" id="btnContact">
            Send Message
          </button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer mt-5 py-4">
      <div class="container text-center">
        <p class="textcolor">© 2024 Sweet Treats | All Rights Reserved</p>
        <p class="textcolor">Privacy Policy | Terms & Conditions</p>
      </div>
    </footer>

    <script src="index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
